[project]
name = "blackboard-mcp"
version = "0.1.0"
description = "Local, read-only Blackboard Ultra MCP with browser-backed authentication"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.23,<3",
  "playwright>=1.55,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
blackboard-mcp = "blackboard_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
