[project]
name = "blackboard-mcp"
version = "0.1.0"
description = "Local, read-only Blackboard Ultra MCP with browser-backed authentication"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lucasdoreac" }]
keywords = ["blackboard", "blackboard-ultra", "mcp", "model-context-protocol", "lms", "students"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "mcp>=1.23,<2",
  "playwright>=1.55,<2",
  "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/Lucasdoreac/blackboard-mcp"
Issues = "https://github.com/Lucasdoreac/blackboard-mcp/issues"

[project.scripts]
blackboard-mcp = "blackboard_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
